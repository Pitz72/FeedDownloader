name: Build & Release

# Trigger esclusivamente manuale (workflow_dispatch).
# Nessun build su push o tag — la pubblicazione è una decisione esplicita.
# Modello identico a Ecosystem-Runtime/Runtime-TelegramBot-Desktop-Titan-Edition.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to bridge repo after build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}

      # build-essential + python3 servono per compilare better-sqlite3
      # imagemagick produce il set di icone PNG richiesto da electron-builder
      # libfuse2 serve per impacchettare/eseguire AppImage
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 imagemagick libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Linux icons (PNG set)
        run: |
          mkdir -p build/icons
          for size in 16 24 32 48 64 96 128 256 512; do
            convert public/logo.png -resize ${size}x${size} build/icons/${size}x${size}.png
          done

      - name: Build (Linux, no publish)
        run: npx tsc && npx vite build && npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            builds/**/*.AppImage
            builds/**/*.deb
            builds/**/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build (Windows, no publish)
        run: npx tsc && npx vite build && npx electron-builder --windows --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/**/*.exe
            builds/**/*.blockmap
            builds/**/latest.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Publish release to bridge repo
        uses: softprops/action-gh-release@v2
        with:
          repository: Ecosystem-Runtime/FeedDownloader-Releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FeedDownloader Pro ${{ steps.version.outputs.tag }}"
          body: |
            ## Runtime FeedDownloader Pro ${{ steps.version.outputs.tag }}

            Download the installer for your platform:

            | Platform | File |
            |----------|------|
            | **Windows** | `*.exe` |
            | **Linux (AppImage)** | `*.AppImage` |
            | **Linux (deb)** | `*.deb` |

            > macOS builds not currently supported.
            > The app updates automatically — existing users will be notified in-app.
          files: |
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb
            artifacts/linux/**/latest-linux.yml
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.blockmap
            artifacts/windows/**/latest.yml
