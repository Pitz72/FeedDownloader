name: Build and Release

# Trigger esclusivamente manuale (workflow_dispatch).
# Nessun build su push o tag — la pubblicazione è una decisione esplicita.
# Modello identico a Ecosystem-Runtime/Runtime-TelegramBot-Desktop-Titan-Edition.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release on this repository after build'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  pull_request:
    branches: [master]

# NOTA: nessun trigger su push. La build non parte mai da sola: si lancia a mano
# con workflow_dispatch. Su pull request gira soltanto il job `verify`, che
# controlla lint, tipi e test ma non produce installer e non pubblica nulla.

# Least privilege by default: `verify` and the two build jobs only checkout and
# build, so read is enough. Since v1.5.0 the release is published on THIS
# repository (the bridge repo is being retired, see docs/PIANO-APERTURA.md), so
# the `release` job — and only that job — raises itself to `contents: write` and
# uses the built-in GITHUB_TOKEN. No PAT is involved any more.
permissions:
  contents: read

jobs:
  # L5: quality gate — lint + type-check (renderer + main) AND the test suite
  # block the build. `npm ci` produces a better-sqlite3 binary for the CI Node
  # ABI, so vitest is run directly (no electron-rebuild needed here). npm audit
  # stays informational (transitive advisories shouldn't block a release).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (better-sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (renderer + preload)
        run: npx tsc --noEmit

      - name: Type-check (main process, no DOM)
        run: npx tsc -p tsconfig.electron.json

      - name: Tests (blocking)
        run: npx vitest run

      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  build-linux:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}

      # build-essential + python3 servono per compilare better-sqlite3
      # libfuse2 serve per impacchettare/eseguire AppImage
      # Le icone: un solo PNG (resources/icon.png), electron-builder genera i
      # formati piattaforma da sé — niente ImageMagick, niente set committato.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build (Linux, no publish)
        run: npx tsc && npx tsc -p tsconfig.electron.json && npx vite build && npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            builds/**/*.AppImage
            builds/**/*.deb
            builds/**/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  build-windows:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build (Windows, no publish)
        run: npx tsc && npx tsc -p tsconfig.electron.json && npx vite build && npx electron-builder --windows --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/*/*.exe
            builds/*/*.blockmap
            builds/*/latest.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Publish release
        # Pinned to a full commit SHA (v2 → 2.6.2) rather than the mutable v2 tag:
        # this step receives a write-scoped token, so a hijacked tag of this
        # action could otherwise abuse it. Bump deliberately when updating.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FeedDownloader Pro ${{ steps.version.outputs.tag }}"
          body: |
            ## Runtime FeedDownloader Pro ${{ steps.version.outputs.tag }}

            Download the installer for your platform:

            | Platform | File |
            |----------|------|
            | **Windows** | `*.exe` |
            | **Linux (AppImage)** | `*.AppImage` |
            | **Linux (deb)** | `*.deb` |

            > macOS is not supported: build from source if you need it.
            > The app checks for updates and tells you in-app; the download starts
            > when you press the button, never on its own.

            Free software under the **MIT licence** — sources in this repository.
          files: |
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb
            artifacts/linux/**/latest-linux.yml
            artifacts/windows/*/*.exe
            artifacts/windows/*/*.blockmap
            artifacts/windows/*/latest.yml
